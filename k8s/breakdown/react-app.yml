apiVersion: v1
kind: Namespace
metadata:
  name: earthdx
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: earthdx
  namespace: earthdx
  labels:
    app: earthdx
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: earthdx
  template:
    metadata:
      labels:
        app: earthdx
    spec:
      containers:
        - name: earthdx
          image: 69966/earthdx:78
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: earthdx-svc
  namespace: earthdx
spec:
  selector:
    app: earthdx
  ports:
    - port: 80
      targetPort: 80