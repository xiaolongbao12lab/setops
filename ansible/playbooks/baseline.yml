---
- name: Base starter for every machines or instances
  hosts: all
  become: true
  gather_facts: false

  pre_tasks:
    - name: Wait for SSH on every host
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 180
    - name: Gather facts now that the hosts are reachable
      ansible.builtin.setup:
        
  roles:
    - common