[defaults]
inventory = inventory.ini
roles_path = roles
host_key_checking    = False
deprecation_warnings = False
interpreter_python   = auto_silent

[ssh_connection]
# ⚡ Bolt Optimization: Enable SSH pipelining to reduce the number of SSH operations
# required to execute a module. Bypasses the need for SCP/SFTP when transferring
# modules, drastically improving execution speed for large network tasks.
pipelining = True