---
- name: Setup Jenkins Instance
  hosts: ci-cd
  become: true
  gather_facts: false

  pre_tasks:
    - name: Wait for SSH to become available
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 180

    - name: Gather facts now that the host is reachable
      ansible.builtin.setup:

  tasks:
    - name: Update the apt cache (retry while unattended-upgrades holds the lock)
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      register: apt_status
      until: apt_status is success
      retries: 5
      delay: 15

    - name: Install Java and prerequisites
      ansible.builtin.apt:
        name:
          - fontconfig
          - openjdk-21-jre        
        state: present

    - name: Add the Jenkins apt signing key
      ansible.builtin.get_url:
        url: https://pkg.jenkins.io/debian-stable/jenkins.io-2023.key
        dest: /usr/share/keyrings/jenkins-keyring.asc
        mode: "0644"

    - name: Add the Jenkins apt repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/"
        filename: jenkins
        state: present

    - name: Install Jenkins
      ansible.builtin.apt:
        name: jenkins
        state: present
        update_cache: true

    - name: Ensure Jenkins is started and enabled
      ansible.builtin.service:
        name: jenkins
        state: started
        enabled: true

    - name: Wait for Jenkins to come up on 8080
      ansible.builtin.wait_for:
        port: 8080
        delay: 10
        timeout: 300

    - name: Read the initial admin password
      ansible.builtin.slurp:
        src: /var/lib/jenkins/secrets/initialAdminPassword
      register: jenkins_admin_pw

    - name: Show the unlock password
      ansible.builtin.debug:
        msg: "Unlock Jenkins with: {{ jenkins_admin_pw.content | b64decode | trim }}"