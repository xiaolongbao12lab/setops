---
# SonarQube embeds Elasticsearch, which won't start unless this is raised.
- name: Raise vm.max_map_count for SonarQube's Elasticsearch
  ansible.posix.sysctl:
    name: vm.max_map_count
    value: "262144"
    state: present
    reload: true

- name: Create a persistent volume for sonarqube data
  community.docker.docker_volume:
    name: sonarqube-data

- name: Run the SonarQube container
  community.docker.docker_container:
    name: sonarqube
    image: sonarqube:latest
    state: started
    restart_policy: unless-stopped
    published_ports:
      - "9000:9000"
    volumes:
      - "sonarqube-data:/opt/sonarqube/data"
      - "sonarqube-extensions:/opt/sonarqube/extensions"

- name: Wait for SonarQube to come up on 9000
  ansible.builtin.wait_for:
    port: 9000
    delay: 30
    timeout: 300

- name: Show how to reach SonarQube
  ansible.builtin.debug:
    msg: "SonarQube: http://{{ ansible_host }}:9000  -  default login admin / admin"