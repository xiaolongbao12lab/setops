- name: Create Nexus data volume
  community.docker.docker_volume:
    name: nexus-data

- name: Start Nexus
  community.docker.docker_container:
    name: nexus
    image: sonatype/nexus3:latest
    state: started
    restart_policy: unless-stopped
    published_ports:
      - "8081:8081"
    volumes:
      - nexus-data:/nexus-data

- name: Wait for Nexus REST API
  ansible.builtin.uri:
    url: "http://{{ ansible_host }}:8081/service/rest/v1/status"
    status_code: 200
  register: nexus_status
  retries: 60
  delay: 10
  until: nexus_status.status == 200

- name: Check whether bootstrap password exists
  ansible.builtin.command:
    cmd: docker exec nexus test -f /nexus-data/admin.password
  register: bootstrap_password_file
  changed_when: false
  failed_when: false

- name: Read bootstrap password
  ansible.builtin.command:
    cmd: docker exec nexus cat /nexus-data/admin.password
  register: bootstrap_password
  changed_when: false
  when: bootstrap_password_file.rc == 0

- name: Change admin password
  ansible.builtin.uri:
    url: "http://{{ ansible_host }}:8081/service/rest/v1/security/users/admin/change-password"
    method: PUT
    user: "{{ nexus_admin_user }}"
    password: "{{ bootstrap_password.stdout | trim }}"
    force_basic_auth: true
    headers:
      Content-Type: text/plain
    body: "{{ nexus_admin_password }}"
    body_format: raw
    status_code: 204
  when: bootstrap_password_file.rc == 0

- name: Set API password
  ansible.builtin.set_fact:
    nexus_api_password: "{{ nexus_admin_password }}"