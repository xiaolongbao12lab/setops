- name: Create the Docker hosted repository (HTTP connector on 8082)
  ansible.builtin.uri:
    url: http://{{ ansible_host }}:8081/service/rest/v1/repositories/docker/hosted
    method: POST
    user: "{{ nexus_admin_user }}"
    password: "{{ nexus_admin_password }}"
    force_basic_auth: true
    body_format: json
    body:
      name: docker-hosted
      online: true
      storage:
        blobStoreName: docker-blob          # <- its own blob store
        strictContentTypeValidation: true
        writePolicy: ALLOW
      docker:
        v1Enabled: false
        forceBasicAuth: true
        httpPort: 8082
    status_code: [201, 400]