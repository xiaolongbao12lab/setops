- name: Create the blob stores (one per format)
  ansible.builtin.uri:
    url: "http://{{ ansible_host }}:8081/service/rest/v1/blobstores/file"
    method: POST
    user: "{{ nexus_admin_user }}"
    password: "{{ nexus_api_password }}"
    force_basic_auth: true
    body_format: json
    body:
      name: "{{ item }}"
      path: "{{ item }}"    
    status_code: [204, 400]       # 204 created, 400 already exists -> idempotent
  loop:
    - docker-blob
    - helm-blob